name: Training lesson worker

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lesson-worker
  cancel-in-progress: false

jobs:
  process-lessons:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LESSON_SUPABASE_URL: ${{ secrets.LESSON_SUPABASE_URL }}
      LESSON_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LESSON_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_LESSON_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_LESSON_SUPABASE_ANON_KEY }}
      LESSON_REVIEWER_EMAILS: ${{ secrets.LESSON_REVIEWER_EMAILS }}
      GEMINI_API_KEY: ${{ secrets.LESSON_GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.LESSON_ELEVENLABS_API_KEY }}
      ELEVENLABS_WEBHOOK_SECRET: ${{ secrets.LESSON_ELEVENLABS_WEBHOOK_SECRET }}
      USE_MOCKS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - run: npm ci --no-audit --no-fund
      - name: Check renderer and configuration
        run: npm run lessons:check
      - name: Process available lesson tasks
        run: npm run lessons:drain
